<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./public/icon.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Application</title>
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/form.css">
    <link rel="stylesheet" href="/css/animations.css">
</head>

<body>
    <div class="container">
        <form class="form">
            <div class="form-header">
                <h1>Information Request</h1>
                <p>Please fill out the form below with your details.</p>
            </div>

            <div class="form-section">
                <div class="form-field">
                    <label for="fullName">Full Name<span class="required">*</span></label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-field">
                    <label for="contactNumber">Contact Number<span class="required">*</span></label>
                    <input type="tel" id="contactNumber" name="contactNumber" required>
                </div>

                <div class="form-field">
                    <label for="email">Email Address<span class="required">*</span></label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-field">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="companyName">
                </div>

                <div class="form-field full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="3"></textarea>
                </div>

                <div class="form-field">
                    <label for="department">Department<span class="required">*</span></label>
                    <div class="select-wrapper">
                        <select id="department" name="department" required>
                            <option value="" disabled selected>Select a department</option>
                            <option value="hr">HR</option>
                            <option value="sales">Sales</option>
                            <option value="development">Development</option>
                            <option value="marketing">Marketing</option>
                            <option value="others">Others</option>
                        </select>
                    </div>
                </div>

                <div class="form-field gender-field">
                    <label>Gender</label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="male" name="gender" value="male">
                            <label for="male">Male</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="female" name="gender" value="female">
                            <label for="female">Female</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="prefer-not-to-say" name="gender" value="prefer-not-to-say">
                            <label for="prefer-not-to-say">Prefer not to say</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-footer">
                <button type="submit" class="submit-button">Submit</button>
            </div>
        </form>
    </div>
    <script type="module" src="/main.js"></script>
</body>

</html>
